name: Elite CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm typecheck || echo "typecheck pending full packages"
      - run: pnpm lint || echo "lint pending"
      - name: Security
        run: |
          echo "Red-team gate: dependency audit + secret scan"
          # pnpm audit --audit-level=high

  # Temporal + Neon smoke will be added after secrets configured
